<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR GENERATOR X</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

min-height:100vh;

background:
linear-gradient(
135deg,
#050816,
#0f172a,
#111827,
#1e1b4b
);

background-size:400% 400%;
animation:bgMove 10s ease infinite;

display:flex;
justify-content:center;
align-items:center;

color:white;
overflow-x:hidden;

}

/* BACKGROUND */

@keyframes bgMove{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}

/* PAGE */

.page{

display:none;
width:100%;
min-height:100vh;

flex-direction:column;
justify-content:center;
align-items:center;

padding:20px;

animation:fade 0.4s ease;

}

@keyframes fade{

from{
opacity:0;
transform:translateY(15px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* LOGO */

.logo{

font-size:48px;
font-weight:900;

letter-spacing:4px;
text-transform:uppercase;

display:flex;
align-items:center;
gap:12px;

margin-bottom:25px;

color:#00f7ff;

text-shadow:
0 0 5px #00f7ff,
0 0 10px #00f7ff,
0 0 20px #00f7ff,
0 0 40px #00f7ff;

animation:neonGlow 2s infinite alternate;

}

.logo span{

font-size:55px;

filter:drop-shadow(
0 0 12px #00f7ff
);

animation:flash 1.5s infinite;

}

@keyframes neonGlow{

from{
transform:scale(1);
}

to{
transform:scale(1.03);
}

}

@keyframes flash{

0%{
transform:rotate(0deg);
}

50%{
transform:rotate(10deg) scale(1.1);
}

100%{
transform:rotate(0deg);
}

}

/* BOX */

.box,
.qr-box,
.card{

background:
rgba(15,23,42,0.7);

border:
1px solid rgba(0,247,255,0.2);

backdrop-filter:blur(14px);

box-shadow:
0 0 20px rgba(0,247,255,0.15);

border-radius:20px;

}

/* LOGIN */

.box{

padding:40px;
width:360px;
text-align:center;

}

/* INPUT */

input,
select{

width:100%;
padding:14px;
margin:10px 0;

border-radius:14px;

border:
1px solid rgba(0,247,255,0.2);

background:
rgba(255,255,255,0.06);

color:white;

outline:none;

font-size:15px;

}

input::placeholder{
color:#cbd5e1;
}

select option{
background:#0f172a;
}

/* BUTTON */

button{

width:100%;
padding:13px;

border:none;
border-radius:14px;

background:
linear-gradient(
90deg,
#00f7ff,
#7c3aed
);

color:white;

font-weight:700;
font-size:15px;

cursor:pointer;
margin-top:10px;

transition:0.3s;

box-shadow:
0 0 15px rgba(0,247,255,0.4);

}

button:hover{

transform:
translateY(-3px)
scale(1.03);

box-shadow:
0 0 25px rgba(0,247,255,0.7);

}

/* DASHBOARD */

.card-container{

display:flex;
gap:20px;
flex-wrap:wrap;
justify-content:center;

margin-top:25px;

}

.card{

width:190px;
height:120px;

display:flex;
justify-content:center;
align-items:center;

cursor:pointer;

font-weight:bold;
font-size:18px;

transition:0.3s;

color:white;

}

.card:hover{

transform:
translateY(-8px)
scale(1.03);

box-shadow:
0 10px 30px rgba(0,0,0,0.35);

}

/* QR BOX */

.qr-box{

padding:25px;
width:350px;

display:flex;
flex-direction:column;
align-items:center;

}

/* QR */

#qr{

margin:20px 0;
display:flex;
justify-content:center;

}

#qr img{

width:220px;
border-radius:14px;

}

/* BACK BUTTON */

.back-btn{

position:fixed;

top:15px;
left:15px;

background:black;
color:white;

padding:8px 15px;

border-radius:20px;

cursor:pointer;

font-size:13px;

z-index:100;

}

/* HISTORY */

#list{

margin-top:20px;
width:350px;

}

.item{

background:
rgba(255,255,255,0.08);

padding:12px;
margin:10px 0;

border-radius:12px;

word-break:break-word;

display:flex;
justify-content:space-between;
align-items:center;

}

/* DELETE */

.delete-btn{

background:red;
color:white;

border:none;

padding:5px 10px;

border-radius:6px;

cursor:pointer;
width:auto;

}

/* PASSWORD */

.eye{

position:absolute;

right:15px;
top:50%;

transform:translateY(-50%);

cursor:pointer;

}

/* POPUP */

#popup{

position:fixed;

top:25px;
right:25px;

background:#00f7ff;
color:black;

padding:15px 25px;

border-radius:12px;

font-weight:bold;

box-shadow:
0 0 20px rgba(0,247,255,0.7);

opacity:0;
pointer-events:none;

transform:translateY(-20px);

transition:0.4s;

z-index:999;

}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="login" class="page">

<h1 class="logo">
<span>⚡</span> QR GENERATOR X
</h1>

<div class="box">

<h2 id="title">Login</h2>

<input
id="email"
type="text"
placeholder="Username">

<div style="position:relative;width:100%">

<input
id="pass"
type="password"
placeholder="Password"
style="padding-right:45px">

<span
class="eye"
onclick="togglePassword()">
👁
</span>

</div>

<button onclick="auth()">
Login
</button>

<p
onclick="forgotPassword()"
style="
margin-top:10px;
cursor:pointer;
font-size:14px">
Forgot Password?
</p>

<p
onclick="toggleMode()"
style="
margin-top:15px;
cursor:pointer">

Create Account

</p>

</div>

</div>

<!-- DASHBOARD -->

<div id="dashboard" class="page">

<h1 class="logo">
<span>⚡</span> QR GENERATOR X
</h1>

<div class="card-container">

<div
class="card"
onclick="showPage('generator')">

Generate QR

</div>

<div
class="card"
onclick="showPage('history')">

History

</div>

</div>

</div>

<!-- GENERATOR -->

<div id="generator" class="page">

<div
class="back-btn"
onclick="showPage('dashboard')">

← Back

</div>

<div class="qr-box">

<h2>Create QR</h2>

<select id="type">

<option value="text">🖼 Image</option>

<option value="link">🌐 Website</option>

<option value="whatsapp">💬 WhatsApp</option>

<option value="call">📞 Call</option>

</select>

<input
id="text"
placeholder="Enter Data">

<button onclick="gen()">
Generate QR
</button>

<div id="qr"></div>

<button onclick="downloadQR()">
Download QR
</button>

</div>

</div>

<!-- HISTORY -->

<div id="history" class="page">

<div
class="back-btn"
onclick="showPage('dashboard')">

← Back

</div>

<h2>QR History</h2>

<div id="list"></div>

</div>

<!-- POPUP -->

<div id="popup"></div>

<script>

/* VARIABLES */

let isLogin=true
let lastData=""

/* PAGE */

function showPage(id){

document.querySelectorAll(".page")
.forEach(p=>{

p.style.display="none"

})

document.getElementById(id)
.style.display="flex"

if(id==="history"){
loadHistory()
}

}

window.onload=()=>{

showPage("login")

}

/* POPUP */

function showPopup(msg){

let popup=
document.getElementById("popup")

popup.innerText=msg

popup.style.opacity="1"
popup.style.transform="translateY(0)"

setTimeout(()=>{

popup.style.opacity="0"

popup.style.transform=
"translateY(-20px)"

},2500)

}

/* PASSWORD */

function togglePassword(){

let pass=
document.getElementById("pass")

if(pass.type==="password"){

pass.type="text"

}else{

pass.type="password"

}

}

/* LOGIN / REGISTER */

function toggleMode(){

isLogin=!isLogin

document.getElementById("title")
.innerText=

isLogin?"Login":"Register"

document.querySelector(".box button")
.innerText=

isLogin?"Login":"Register"

}

/* AUTH */

function auth(){

let email=
document.getElementById("email")
.value.trim()

let pass=
document.getElementById("pass")
.value.trim()

if(email===""){
return showPopup("Enter Username ❌")
}

if(pass===""){
return showPopup("Enter Password ❌")
}

if(pass.length<4){
return showPopup("Password too short ❌")
}

let users=
JSON.parse(
localStorage.getItem("users") || "{}"
)

/* LOGIN */

if(isLogin){

if(users[email] &&
users[email]===pass){

localStorage.setItem(
"currentUser",
email
)

showPopup("Login Successful 🚀")

showPage("dashboard")

}else{

showPopup("Wrong Username or Password ❌")

}

}

/* REGISTER */

else{

if(users[email]){

return showPopup(
"Account already exists ❌"
)

}

users[email]=pass

localStorage.setItem(
"users",
JSON.stringify(users)
)

showPopup("Account Created 🎉")

toggleMode()

}

}

/* ENTER KEY */

document.addEventListener(
"keypress",
function(e){

if(e.key==="Enter"){
auth()
}

})

/* FORGOT PASSWORD */

function forgotPassword(){

let username=
prompt("Enter Username")

if(!username){
return
}

let users=
JSON.parse(
localStorage.getItem("users") || "{}"
)

if(users[username]){

showPopup(
"Password: " + users[username]
)

}else{

showPopup("User not found ❌")

}

}

/* PLACEHOLDER */

document.getElementById("type")
.addEventListener("change",function(){

let type=this.value

let input=
document.getElementById("text")

if(type==="whatsapp"){

input.placeholder=
"Enter Mobile Number"

}

else if(type==="link"){

input.placeholder=
"Enter Website URL"

}

else if(type==="call"){

input.placeholder=
"Enter Phone Number"

}

else{

input.placeholder=
"Enter Image/Text Data"

}

})

/* GENERATE */

function gen(){

let text=
document.getElementById("text")
.value.trim()

let type=
document.getElementById("type")
.value

if(text===""){
return showPopup("Enter Data ❌")
}

/* WEBSITE */

if(type==="link" &&
!text.startsWith("http")){

text="https://"+text

}

/* WHATSAPP */

if(type==="whatsapp"){

text="https://wa.me/91"+text

}

/* CALL */

if(type==="call"){

text="tel:"+text

}

lastData=text

/* SAVE HISTORY */

let currentUser=
localStorage.getItem("currentUser")

let history=
JSON.parse(

localStorage.getItem(
"history_"+currentUser
) || "[]"

)

history.unshift(text)

if(history.length>20){
history.pop()
}

localStorage.setItem(

"history_"+currentUser,

JSON.stringify(history)

)

/* QR */

let url=

`https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=`+

encodeURIComponent(lastData)

document.getElementById("qr")
.innerHTML=

`<img src="${url}">`

showPopup("QR Generated ⚡")

}

/* DOWNLOAD */

function downloadQR(){

if(!lastData){

return showPopup(
"Generate QR first ❌"
)

}

let a=document.createElement("a")

a.href=

`https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=`+

encodeURIComponent(lastData)

a.download="qr.png"

a.click()

showPopup("QR Downloaded 🎉")

}

/* HISTORY */

function loadHistory(){

let currentUser=
localStorage.getItem("currentUser")

let history=
JSON.parse(

localStorage.getItem(
"history_"+currentUser
) || "[]"

)

document.getElementById("list")
.innerHTML=

history.map((item,index)=>`

<div class="item">

<span>${item}</span>

<button
class="delete-btn"
onclick="deleteHistory(${index})">

Delete

</button>

</div>

`).join("")

}

/* DELETE */

function deleteHistory(index){

let currentUser=
localStorage.getItem("currentUser")

let history=
JSON.parse(

localStorage.getItem(
"history_"+currentUser
) || "[]"

)

history.splice(index,1)

localStorage.setItem(

"history_"+currentUser,

JSON.stringify(history)

)

loadHistory()

showPopup("History Deleted 🗑")

}

</script>

</body>
</html>
