<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Master Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#667eea,#764ba2);
display:flex;
justify-content:center;
align-items:center;
color:white;
overflow-x:hidden;
transition:0.3s;
}

/* DARK MODE */

.dark{
background:#0f172a !important;
}

.dark .box,
.dark .qr-box,
.dark .card{
background:#1e293b !important;
color:white;
}

.dark input,
.dark select{
background:#334155;
color:white;
}

.dark .item{
background:#334155;
color:white;
}

/* PAGE */

.page{
display:none;
width:100%;
min-height:100vh;
flex-direction:column;
justify-content:center;
align-items:center;
padding:20px;
}

/* LOGIN */

.box{
background:rgba(255,255,255,0.15);
padding:40px;
border-radius:20px;
width:360px;
backdrop-filter:blur(10px);
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

/* INPUT */

input,select{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
outline:none;
font-size:15px;
}

/* BUTTON */

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:white;
color:#4f46e5;
font-weight:bold;
cursor:pointer;
margin-top:10px;
transition:0.2s;
}

button:hover{
transform:scale(1.03);
}

/* DASHBOARD */

.card-container{
display:flex;
gap:20px;
flex-wrap:wrap;
justify-content:center;
margin-top:25px;
}

.card{
width:190px;
height:120px;
background:white;
color:black;
border-radius:15px;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
font-weight:bold;
font-size:18px;
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

/* QR BOX */

.qr-box{
background:rgba(255,255,255,0.15);
padding:25px;
border-radius:20px;
width:340px;
display:flex;
flex-direction:column;
align-items:center;
backdrop-filter:blur(10px);
}

/* QR */

#qr{
margin:20px 0;
display:flex;
justify-content:center;
}

#qr img{
width:200px;
border-radius:10px;
}

/* TOP BUTTONS */

.back-btn,.theme-btn{
position:fixed;
left:15px;
background:black;
color:white;
padding:8px 15px;
border-radius:20px;
cursor:pointer;
font-size:13px;
z-index:100;
}

.back-btn{
top:15px;
}

.theme-btn{
top:60px;
}

/* TEMPLATE */

.template-bar{
margin-top:15px;
display:none;
flex-wrap:wrap;
gap:10px;
justify-content:center;
max-height:200px;
overflow-y:auto;
}

.template-bar img{
width:65px;
height:65px;
object-fit:cover;
border-radius:10px;
cursor:pointer;
border:2px solid white;
transition:0.2s;
}

.template-bar img:hover{
transform:scale(1.1);
border-color:yellow;
}

/* HISTORY */

#list{
margin-top:20px;
width:350px;
}

.item{
background:white;
color:black;
padding:12px;
margin:10px 0;
border-radius:10px;
word-break:break-word;
display:flex;
justify-content:space-between;
align-items:center;
}

.delete-btn{
background:red;
color:white;
border:none;
padding:5px 10px;
border-radius:6px;
cursor:pointer;
width:auto;
}

/* PASSWORD ICON */

.eye{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
color:black;
font-size:14px;
}

</style>
</head>

<body>

<!-- LOGIN PAGE -->

<div id="login" class="page">

<div class="box">

<h2 id="title">Login</h2>

<input id="email" type="email" placeholder="Email">

<div style="position:relative;width:100%">

<input 
id="pass" 
type="password" 
placeholder="Password"
style="padding-right:45px"
>

<span class="eye" onclick="togglePassword()">👁</span>

</div>

<button id="authBtn" onclick="auth()">Login</button>

<p 
id="switchText"
onclick="toggleMode()" 
style="margin-top:15px;cursor:pointer"
>
Create Account
</p>

</div>

</div>

<!-- DASHBOARD -->

<div id="dashboard" class="page">

<h1>QR Master Pro</h1>

<div class="card-container">

<div class="card" onclick="showPage('generator')">
Generate QR
</div>

<div class="card" onclick="showPage('history')">
History
</div>

</div>

</div>

<!-- GENERATOR -->

<div id="generator" class="page">

<div class="back-btn" onclick="showPage('dashboard')">
← Back
</div>

<div class="theme-btn" onclick="toggleTheme()">
🌙 Theme
</div>

<div class="qr-box">

<h2>Create QR</h2>

<select id="type">

<option value="text">Text</option>
<option value="link">Website</option>
<option value="whatsapp">WhatsApp</option>
<option value="call">Call</option>

</select>

<input id="text" placeholder="Enter data">

<button onclick="gen()">Generate QR</button>

<div id="qr"></div>

<button onclick="toggleTemplates()">
Templates 🎨
</button>

<div id="templates" class="template-bar">

<img src="t1.png" onclick="applyTemplate('t1')">
<img src="t2.png" onclick="applyTemplate('t2')">
<img src="t3.png" onclick="applyTemplate('t3')">
<img src="t4.png" onclick="applyTemplate('t4')">
<img src="t5.png" onclick="applyTemplate('t5')">
<img src="t6.png" onclick="applyTemplate('t6')">

</div>

<button onclick="downloadQR()">
Download QR
</button>

</div>

</div>

<!-- HISTORY -->

<div id="history" class="page">

<div class="back-btn" onclick="showPage('dashboard')">
← Back
</div>

<h2>QR History</h2>

<div id="list"></div>

</div>

<script>

/* VARIABLES */

let isLogin=true
let lastData=""

/* PAGE NAVIGATION */

function showPage(id){

document.querySelectorAll(".page").forEach(page=>{
page.style.display="none"
})

document.getElementById(id).style.display="flex"

if(id==="history"){
loadHistory()
}

}

window.onload=()=>{
showPage("login")
}

/* THEME */

function toggleTheme(){
document.body.classList.toggle("dark")
}

/* PASSWORD SHOW HIDE */

function togglePassword(){

let pass=document.getElementById("pass")

if(pass.type==="password"){
pass.type="text"
}else{
pass.type="password"
}

}

/* LOGIN REGISTER SWITCH */

function toggleMode(){

isLogin = !isLogin

let title = document.getElementById("title")
let btn = document.getElementById("authBtn")
let switchText = document.getElementById("switchText")

if(isLogin){

title.innerText = "Login"
btn.innerText = "Login"
switchText.innerText = "Create Account"

}else{

title.innerText = "Register"
btn.innerText = "Register"
switchText.innerText = "Already Have Account ?"

}

}

/* AUTH SYSTEM */

function auth(){

let email=document.getElementById("email").value.trim()
let pass=document.getElementById("pass").value.trim()

if(email===""){
return alert("Enter Email")
}

if(pass===""){
return alert("Enter Password")
}

if(!email.includes("@") || !email.includes(".")){
return alert("Enter Valid Email")
}

if(pass.length<4){
return alert("Password Minimum 4 Characters")
}

let users=JSON.parse(localStorage.getItem("users") || "{}")

/* LOGIN */

if(isLogin){

if(users[email] && users[email]===pass){

alert("Login Successful")

showPage("dashboard")

}else{

alert("Wrong Email Or Password")

}

}

/* REGISTER */

else{

if(users[email]){
return alert("Account Already Exists")
}

users[email]=pass

localStorage.setItem("users",JSON.stringify(users))

alert("Registration Successful")

toggleMode()

}

}

/* ENTER KEY SUPPORT */

document.addEventListener("keypress",function(e){

if(e.key==="Enter"){

if(document.getElementById("login").style.display==="flex"){
auth()
}

}

})

/* QR GENERATE */

function gen(){

let text=document.getElementById("text").value.trim()
let type=document.getElementById("type").value

if(text===""){
return alert("Enter data")
}

if(type==="link" && !text.startsWith("http")){
text="https://"+text
}

if(type==="whatsapp"){
text="https://wa.me/91"+text
}

if(type==="call"){
text="tel:"+text
}

lastData=text

/* SAVE HISTORY */

let history=
JSON.parse(localStorage.getItem("history") || "[]")

history.unshift(text)

if(history.length>20){
history.pop()
}

localStorage.setItem("history",JSON.stringify(history))

let url=
`https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=`+
encodeURIComponent(lastData)

document.getElementById("qr").innerHTML=
`<img src="${url}">`

}

/* TEMPLATE */

function toggleTemplates(){

let t=document.getElementById("templates")

t.style.display=
t.style.display==="flex"?"none":"flex"

}

function applyTemplate(t){

if(!lastData){
return alert("Generate QR First")
}

let url=
`https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=`+
encodeURIComponent(lastData)

let style=""

if(t==="t1")
style="background:#d1fae5;padding:10px;border-radius:20px"

if(t==="t2")
style="background:#111;padding:10px;border-radius:20px;color:white"

if(t==="t3")
style="background:#fca5a5;padding:10px;border-radius:20px"

if(t==="t4")
style="background:#fde68a;padding:10px;border-radius:20px"

if(t==="t5")
style="background:#67e8f9;padding:15px;border-radius:50%"

if(t==="t6")
style="background:#000;padding:10px;border-radius:20px;color:white"

document.getElementById("qr").innerHTML=`

<div style="text-align:center;${style}">

<img src="${url}">

<div style="margin-top:8px;font-weight:bold">
SCAN ME
</div>

</div>

`

}

/* DOWNLOAD */

function downloadQR(){

if(!lastData){
return alert("Generate QR first")
}

let img=new Image()

img.crossOrigin="anonymous"

img.src=
`https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=`+
encodeURIComponent(lastData)

img.onload=function(){

let canvas=document.createElement("canvas")

canvas.width=300
canvas.height=300

let ctx=canvas.getContext("2d")

ctx.drawImage(img,0,0)

let a=document.createElement("a")

a.download="qr.png"

a.href=canvas.toDataURL()

a.click()

}

}

/* HISTORY */

function loadHistory(){

let history=
JSON.parse(localStorage.getItem("history") || "[]")

document.getElementById("list").innerHTML=
history.map((item,index)=>`

<div class="item">

<span>${item}</span>

<button class="delete-btn"
onclick="deleteHistory(${index})">
Delete
</button>

</div>

`).join("")

}

/* DELETE HISTORY */

function deleteHistory(index){

let history=
JSON.parse(localStorage.getItem("history") || "[]")

history.splice(index,1)

localStorage.setItem("history",JSON.stringify(history))

loadHistory()

}

</script>

</body>
</html>
